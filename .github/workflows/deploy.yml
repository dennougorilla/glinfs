name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # AI cutout models (about 176 + 179 MB, too large for the repository):
      # restored from the cache or downloaded from their pinned Hugging Face
      # commits. The cache key holds every pinned SHA-256
      # (src/features/ai-cutout/model-registry.js, which the fetch script
      # reads; a unit test keeps this file in sync with it).
      - name: Restore AI cutout models
        uses: actions/cache@v4
        with:
          path: |
            public/models/isnetis.onnx
            public/models/isnet-general-use.onnx
          key: ai-models-sha256-f15622d853e8260172812b657053460e20806f04b9e05147d49af7bed31a6e99-60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a
      # Verifies size and SHA-256 of restored copies too; any mismatch
      # re-downloads, and a mismatching download fails the job
      - name: Fetch AI cutout models
        run: npm run models:fetch
      - run: npm run build
      - name: Verify the models in the Pages artifact
        run: |
          check() {
            actual=$(sha256sum "dist/models/$1" | cut -d' ' -f1)
            if [ "$actual" != "$2" ]; then
              echo "::error::dist/models/$1 SHA-256 is $actual, expected $2"
              exit 1
            fi
          }
          check isnetis.onnx f15622d853e8260172812b657053460e20806f04b9e05147d49af7bed31a6e99
          check isnet-general-use.onnx 60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a
      # GitHub Pages rejects artifacts of 1 GB or more
      - name: Check the Pages artifact size
        run: |
          bytes=$(du -sb dist | cut -f1)
          echo "Pages artifact: $bytes bytes"
          if [ "$bytes" -ge 1000000000 ]; then
            echo "::error::dist is $bytes bytes; GitHub Pages artifacts must stay under 1 GB"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
